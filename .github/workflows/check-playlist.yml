name: Check playlist

on:
  schedule:
    - cron: "20 4 */6 * *"   # every 6 days at 04:20 UTC
  workflow_dispatch:          # also runnable by hand from the Actions tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Tests every stream. Dead channels are first healed with a fresh URL
      # from the upstream sources (iptv-org API + Free-TV); only the ones with
      # no working replacement are removed. Pass --no-replace to disable healing.
      - name: Test and heal every stream
        run: python3 check_streams.py list.m3u

      - name: Commit the healed / cleaned playlist
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add list.m3u removed.m3u strikes.json health.md
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "Heal and clean playlist ($(date -u +%Y-%m-%d))"
            git push
          fi
